name: Update Confirmation Logout Button

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-confirmation-logout:
    name: Modifier uniquement Déconnexion de la confirmation
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Modifier uniquement le bouton de confirmation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/LogoutConfirmModal.tsx")

          if not path.exists():
              raise SystemExit(
                  "ERREUR : src/components/LogoutConfirmModal.tsx introuvable."
              )

          text = path.read_text(encoding="utf-8")

          # Trouver les blocs Button complets sans traverser plusieurs boutons.
          button_pattern = re.compile(
              r"<Button\b[^>]*>[\s\S]*?</Button>",
              re.MULTILINE
          )

          matches = list(button_pattern.finditer(text))

          target = None

          for match in matches:
              block = match.group(0)

              # Cible UNIQUEMENT le bouton de confirmation.
              if (
                  "onClick={onConfirm}" in block
                  and "Déconnexion" in block
              ):
                  target = match
                  break

          if target is None:
              raise SystemExit(
                  "ERREUR : bouton de confirmation Déconnexion introuvable."
              )

          old = target.group(0)

          new = '''<Button
            className="flex-1 bg-black text-white hover:bg-black/85 dark:bg-white dark:text-black dark:hover:bg-white/85"
            onClick={onConfirm}
            disabled={loading}
          >
            {loading ? <Loader2 className="w-4 h-4 animate-spin mr-1" /> : null}
            {loading ? "Déconnexion..." : "Déconnexion"}
          </Button>'''

          text = text[:target.start()] + new + text[target.end():]

          path.write_text(text, encoding="utf-8")

          print("✓ Seul le bouton de confirmation Déconnexion a été modifié.")

      - name: Vérifier précisément la modification
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/LogoutConfirmModal.tsx")
          text = path.read_text(encoding="utf-8")

          button_pattern = re.compile(
              r"<Button\b[^>]*>[\s\S]*?</Button>",
              re.MULTILINE
          )

          buttons = [m.group(0) for m in button_pattern.finditer(text)]

          confirmation_buttons = [
              b for b in buttons
              if "onClick={onConfirm}" in b and "Déconnexion" in b
          ]

          if len(confirmation_buttons) != 1:
              raise SystemExit(
                  f"ERREUR : {len(confirmation_buttons)} bouton(s) de confirmation trouvé(s), 1 attendu."
              )

          button = confirmation_buttons[0]

          required = [
              'bg-black text-white',
              'dark:bg-white dark:text-black',
              'onClick={onConfirm}',
              'disabled={loading}',
              '"Déconnexion"',
          ]

          for value in required:
              if value not in button:
                  raise SystemExit(
                      f"ERREUR : élément attendu absent du bouton : {value}"
                  )

          if "variant=\"destructive\"" in button:
              raise SystemExit(
                  "ERREUR : l'ancien variant destructive est encore présent."
              )

          # Vérifie que le bouton Annuler existe toujours.
          if 'onClick={onClose}' not in text or "Annuler" not in text:
              raise SystemExit(
                  "ERREUR : le bouton Annuler semble avoir été modifié ou supprimé."
              )

          print("✓ Bouton confirmation : noir en mode clair.")
          print("✓ Bouton confirmation : blanc en mode sombre.")
          print("✓ Texte adapté au thème.")
          print("✓ onConfirm conservé.")
          print("✓ Annuler conservé.")
          print("✓ Aucun autre bouton ciblé.")

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le build
        run: npm run build

      - name: Configurer Git
        run: |
          git config user.name "gestontech"
          git config user.email "gestonvandael15@gmail.com"

      - name: Enregistrer et pousser
        shell: bash
        run: |
          git add src/components/LogoutConfirmModal.tsx

          if git diff --cached --quiet; then
            echo "Aucune modification à pousser."
            exit 0
          fi

          git commit -m "Style confirmation logout button"
          git push origin main
