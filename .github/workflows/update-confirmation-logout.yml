name: Update Confirmation Logout Button

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-confirmation-logout:
    name: Modifier uniquement Déconnexion de la confirmation
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Modifier uniquement le bouton Déconnexion
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/LogoutConfirmModal.tsx")

          if not path.exists():
              raise SystemExit(
                  "ERREUR : src/components/LogoutConfirmModal.tsx introuvable."
              )

          text = path.read_text(encoding="utf-8")

          # Cherche uniquement le Button qui déclenche onConfirm.
          pattern = re.compile(
              r'<Button\b(?=[\s\S]*?onClick=\{onConfirm\})[\s\S]*?</Button>',
              re.MULTILINE
          )

          matches = list(pattern.finditer(text))

          if not matches:
              raise SystemExit(
                  "ERREUR : aucun bouton de confirmation avec onClick={onConfirm} trouvé."
              )

          # On prend le dernier bouton correspondant dans la fenêtre de confirmation.
          match = matches[-1]
          old = match.group(0)

          # Sécurité : ce bouton doit bien contenir Déconnexion.
          if "Déconnexion" not in old:
              raise SystemExit(
                  "ERREUR : le bouton trouvé ne contient pas 'Déconnexion'."
              )

          new = '''<Button
            className="flex-1 bg-black text-white hover:bg-black/85 dark:bg-white dark:text-black dark:hover:bg-white/85"
            onClick={onConfirm}
            disabled={loading}
          >
            {loading ? <Loader2 className="w-4 h-4 animate-spin mr-1" /> : null}
            {loading ? "Déconnexion..." : "Déconnexion"}
          </Button>'''

          text = text[:match.start()] + new + text[match.end():]

          path.write_text(text, encoding="utf-8")

          print("✓ Bouton Déconnexion de la confirmation modifié uniquement.")

      - name: Vérifier la modification
        shell: bash
        run: |
          grep -q 'bg-black text-white' src/components/LogoutConfirmModal.tsx
          grep -q 'dark:bg-white dark:text-black' src/components/LogoutConfirmModal.tsx
          grep -q 'onClick={onConfirm}' src/components/LogoutConfirmModal.tsx
          grep -q '"Déconnexion"' src/components/LogoutConfirmModal.tsx
          grep -q '"Annuler"' src/components/LogoutConfirmModal.tsx

          echo "✓ Mode clair : bouton Déconnexion noir."
          echo "✓ Mode sombre : bouton Déconnexion blanc."
          echo "✓ Annuler conservé."
          echo "✓ Action onConfirm conservée."

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le build
        run: npm run build

      - name: Configurer Git
        run: |
          git config user.name "gestontech"
          git config user.email "gestonvandael15@gmail.com"

      - name: Enregistrer et pousser
        shell: bash
        run: |
          git add src/components/LogoutConfirmModal.tsx

          if git diff --cached --quiet; then
            echo "Aucune modification à pousser."
            exit 0
          fi

          git commit -m "Style confirmation logout button"
          git push origin main
