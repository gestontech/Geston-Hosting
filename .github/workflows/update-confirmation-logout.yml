name: Update Confirmation Logout Text

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-logout-text:
    name: Modifier uniquement le texte du bouton Déconnexion
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Modifier uniquement la couleur du texte
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/LogoutConfirmModal.tsx")

          if not path.exists():
              raise SystemExit(
                  "ERREUR : src/components/LogoutConfirmModal.tsx introuvable."
              )

          text = path.read_text(encoding="utf-8")

          button_pattern = re.compile(
              r"<Button\b[^>]*>[\s\S]*?</Button>",
              re.MULTILINE
          )

          matches = list(button_pattern.finditer(text))

          target = None

          for match in matches:
              block = match.group(0)

              # Cible uniquement le bouton de confirmation.
              if (
                  "onClick={onConfirm}" in block
                  and "Déconnexion" in block
              ):
                  target = match
                  break

          if target is None:
              raise SystemExit(
                  "ERREUR : bouton de confirmation Déconnexion introuvable."
              )

          old = target.group(0)

          # Modifier UNIQUEMENT les couleurs du texte.
          new = re.sub(
              r'className="([^"]*)"',
              lambda m: (
                  'className="' +
                  re.sub(
                      r'\btext-(?:white|black|foreground)\b',
                      '',
                      m.group(1)
                  ).strip() +
                  ' text-black dark:text-white"'
              ),
              old,
              count=1
          )

          if new == old:
              raise SystemExit(
                  "ERREUR : impossible de modifier uniquement la couleur du texte."
              )

          text = text[:target.start()] + new + text[target.end():]

          path.write_text(text, encoding="utf-8")

          print("✓ Fond du bouton conservé.")
          print("✓ Seule la couleur du texte a été modifiée.")
          print("✓ Mode clair : texte noir.")
          print("✓ Mode sombre : texte blanc.")

      - name: Vérifier précisément la modification
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/LogoutConfirmModal.tsx")
          text = path.read_text(encoding="utf-8")

          button_pattern = re.compile(
              r"<Button\b[^>]*>[\s\S]*?</Button>",
              re.MULTILINE
          )

          buttons = [m.group(0) for m in button_pattern.finditer(text)]

          confirmation_buttons = [
              b for b in buttons
              if "onClick={onConfirm}" in b and "Déconnexion" in b
          ]

          if len(confirmation_buttons) != 1:
              raise SystemExit(
                  f"ERREUR : {len(confirmation_buttons)} bouton(s) trouvé(s), 1 attendu."
              )

          button = confirmation_buttons[0]

          if "text-black" not in button:
              raise SystemExit(
                  "ERREUR : text-black absent du bouton."
              )

          if "dark:text-white" not in button:
              raise SystemExit(
                  "ERREUR : dark:text-white absent du bouton."
              )

          # Vérifier qu'aucune couleur de fond n'a été ajoutée/modifiée
          # par cette opération.
          if "bg-black" in button or "bg-white" in button:
              raise SystemExit(
                  "ERREUR : une couleur de fond a été ajoutée au bouton."
              )

          if 'onClick={onConfirm}' not in button:
              raise SystemExit(
                  "ERREUR : onConfirm a été modifié."
              )

          if '"Déconnexion"' not in button:
              raise SystemExit(
                  "ERREUR : texte Déconnexion absent."
              )

          if 'onClick={onClose}' not in text or "Annuler" not in text:
              raise SystemExit(
                  "ERREUR : bouton Annuler modifié ou supprimé."
              )

          print("✓ Mode clair : texte noir.")
          print("✓ Mode sombre : texte blanc.")
          print("✓ Fond du bouton non modifié.")
          print("✓ Déconnexion conservé.")
          print("✓ Annuler conservé.")
          print("✓ Aucun autre bouton ciblé.")

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le build
        run: npm run build

      - name: Configurer Git
        run: |
          git config user.name "gestontech"
          git config user.email "gestonvandael15@gmail.com"

      - name: Enregistrer et pousser
        shell: bash
        run: |
          git add src/components/LogoutConfirmModal.tsx

          if git diff --cached --quiet; then
            echo "Aucune modification à pousser."
            exit 0
          fi

          git commit -m "Fix logout confirmation text color"
          git push origin main
