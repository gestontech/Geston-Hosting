name: Update Confirmation Logout Text

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-logout-text:
    name: Modifier uniquement le texte Déconnexion
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Modifier uniquement la couleur du texte
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/LogoutConfirmModal.tsx")

          if not path.exists():
              raise SystemExit(
                  "ERREUR : src/components/LogoutConfirmModal.tsx introuvable."
              )

          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"<Button\b[^>]*>[\s\S]*?</Button>",
              re.MULTILINE
          )

          matches = list(pattern.finditer(text))

          target = None

          for match in matches:
              block = match.group(0)

              if (
                  "onClick={onConfirm}" in block
                  and "Déconnexion" in block
              ):
                  target = match
                  break

          if target is None:
              raise SystemExit(
                  "ERREUR : bouton de confirmation Déconnexion introuvable."
              )

          old = target.group(0)

          class_match = re.search(
              r'className="([^"]*)"',
              old
          )

          if class_match is None:
              raise SystemExit(
                  "ERREUR : className du bouton introuvable."
              )

          old_classes = class_match.group(1)

          # Conserver absolument toutes les classes existantes,
          # sauf les anciennes classes de couleur du texte.
          new_classes = re.sub(
              r'(^|\s)text-(?:white|black|foreground)(?=\s|$)',
              '',
              old_classes
          )

          new_classes = re.sub(
              r'\s+',
              ' ',
              new_classes
          ).strip()

          # Ajouter uniquement les couleurs de texte demandées.
          new_classes += " text-black dark:text-white"

          new = (
              old[:class_match.start(1)]
              + new_classes
              + old[class_match.end(1):]
          )

          text = text[:target.start()] + new + text[target.end():]

          path.write_text(text, encoding="utf-8")

          print("✓ Fond du bouton conservé.")
          print("✓ Seule la couleur du texte a été modifiée.")
          print("✓ Mode clair : texte noir.")
          print("✓ Mode sombre : texte blanc.")

      - name: Vérifier la modification
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path("src/components/LogoutConfirmModal.tsx")
          current = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"<Button\b[^>]*>[\s\S]*?</Button>",
              re.MULTILINE
          )

          buttons = [m.group(0) for m in pattern.finditer(current)]

          targets = [
              b for b in buttons
              if "onClick={onConfirm}" in b
              and "Déconnexion" in b
          ]

          if len(targets) != 1:
              raise SystemExit(
                  f"ERREUR : {len(targets)} bouton(s) de confirmation trouvé(s)."
              )

          button = targets[0]

          if "text-black" not in button:
              raise SystemExit("ERREUR : text-black absent.")

          if "dark:text-white" not in button:
              raise SystemExit("ERREUR : dark:text-white absent.")

          if 'onClick={onConfirm}' not in button:
              raise SystemExit("ERREUR : onConfirm modifié.")

          if '"Déconnexion"' not in button:
              raise SystemExit("ERREUR : Déconnexion absent.")

          # Vérifier que Annuler est toujours présent.
          if 'onClick={onClose}' not in current:
              raise SystemExit("ERREUR : Annuler/onClose modifié.")

          if "Annuler" not in current:
              raise SystemExit("ERREUR : Annuler supprimé.")

          # Vérifier qu'aucune classe de fond n'a été ajoutée
          # ou supprimée par rapport au commit de départ.
          old = subprocess.check_output(
              [
                  "git",
                  "show",
                  "HEAD:src/components/LogoutConfirmModal.tsx"
              ],
              text=True
          )

          old_matches = list(pattern.finditer(old))
          old_targets = [
              m.group(0)
              for m in old_matches
              if "onClick={onConfirm}" in m.group(0)
              and "Déconnexion" in m.group(0)
          ]

          if len(old_targets) != 1:
              raise SystemExit(
                  "ERREUR : impossible d'identifier le bouton original."
              )

          old_button = old_targets[0]

          old_class = re.search(
              r'className="([^"]*)"',
              old_button
          )

          new_class = re.search(
              r'className="([^"]*)"',
              button
          )

          if not old_class or not new_class:
              raise SystemExit(
                  "ERREUR : impossible de comparer les classes."
              )

          def background_classes(value):
              return sorted(
                  c for c in value.split()
                  if c.startswith("bg-")
              )

          if background_classes(old_class.group(1)) != background_classes(new_class.group(1)):
              raise SystemExit(
                  "ERREUR : les classes de fond du bouton ont été modifiées."
              )

          print("✓ Texte noir en mode clair.")
          print("✓ Texte blanc en mode sombre.")
          print("✓ Fond du bouton strictement conservé.")
          print("✓ Annuler conservé.")
          print("✓ onConfirm conservé.")
          print("✓ Aucun autre bouton ciblé.")

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le build
        run: npm run build

      - name: Configurer Git
        run: |
          git config user.name "gestontech"
          git config user.email "gestonvandael15@gmail.com"

      - name: Enregistrer et pousser
        run: |
          git add src/components/LogoutConfirmModal.tsx

          if git diff --cached --quiet; then
            echo "Aucune modification à pousser."
            exit 0
          fi

          git commit -m "Fix logout confirmation text color"
          git push origin main
