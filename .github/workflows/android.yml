name: Geston Hosting - Android Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geston-hosting-android-release
  cancel-in-progress: true

jobs:
  android-release:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        env:
          NODE_ENV: production
          JWT_SECRET: ci-test-secret-not-for-production
          SESSION_SECRET: ci-session-secret-not-for-production
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-not-for-production
          MONGODB_URI: mongodb://localhost:27017/geston-hosting-ci
          APP_URL: https://hosting.gestontech.online
          CLIENT_URL: https://hosting.gestontech.online
          SITE_URL: https://hosting.gestontech.online
          FRONTEND_ORIGIN: https://hosting.gestontech.online
        run: npm run build

      - name: Verify web build
        run: |
          test -f dist/index.html
          test -f dist-server/index.js

          echo "Web build verified successfully."

      - name: Generate Android project
        run: npx cap add android

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret: ANDROID_KEYSTORE_BASE64"
            missing=1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing GitHub secret: ANDROID_KEYSTORE_PASSWORD"
            missing=1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Missing GitHub secret: ANDROID_KEY_ALIAS"
            missing=1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing GitHub secret: ANDROID_KEY_PASSWORD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Android release signing cannot continue until all four signing secrets are configured."
            exit 1
          fi

          echo "All Android signing secrets are present."

      - name: Install release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks

          if [ ! -s android/release.jks ]; then
            echo "::error::The decoded Android keystore is empty."
            exit 1
          fi

          file android/release.jks

      - name: Validate release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Android release keystore is valid."

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle was not generated."
              )

          content = path.read_text()

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("../release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in content:
              if "android {" not in content:
                  raise SystemExit(
                      "Impossible de trouver le bloc android dans android/app/build.gradle."
                  )

              content = content.replace(
                  "android {",
                  "android {" + signing_config,
                  1
              )

          if "signingConfig signingConfigs.release" not in content:
              build_types_index = content.find("buildTypes {")

              if build_types_index == -1:
                  raise SystemExit(
                      "Impossible de trouver buildTypes dans android/app/build.gradle."
                  )

              release_index = content.find(
                  "release {",
                  build_types_index
              )

              if release_index == -1:
                  raise SystemExit(
                      "Impossible de trouver le buildType release."
                  )

              insert_position = release_index + len("release {")

              content = (
                  content[:insert_position]
                  + "\n            signingConfig signingConfigs.release"
                  + content[insert_position:]
              )

          path.write_text(content)

          print("Android release signing configured.")
          PY

      - name: Verify Android signing configuration
        run: |
          grep -q "signingConfigs" android/app/build.gradle
          grep -q "signingConfigs.release" android/app/build.gradle
          test -s android/release.jks

          echo "Android signing configuration verified."

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify release outputs
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab

          echo "========================================"
          echo "GESTON HOSTING ANDROID RELEASE"
          echo "========================================"

          ls -lh android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

          echo "========================================"
          echo "APK and AAB successfully generated."
          echo "========================================"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geston-hosting-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/release.jks

          if [ -f android/release.jks ]; then
            echo "::warning::Android release keystore could not be removed."
          else
            echo "Android release signing material removed."
          fi
