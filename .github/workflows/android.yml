name: Geston Hosting - Android

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        env:
          NODE_ENV: production

          JWT_SECRET: ci-test-secret-not-for-production
          SESSION_SECRET: ci-session-secret-not-for-production

          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-not-for-production

          MONGODB_URI: mongodb://localhost:27017/geston-hosting-ci

          APP_URL: https://hosting.gestontech.online
          CLIENT_URL: https://hosting.gestontech.online
          SITE_URL: https://hosting.gestontech.online
          FRONTEND_ORIGIN: https://hosting.gestontech.online

        run: npm run build

      - name: Verify web build
        run: |
          test -f dist/index.html
          test -f dist-server/index.js

      - name: Install Capacitor Android
        run: npx cap add android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo "========================================"
          echo "ANDROID APK"
          echo "========================================"

          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geston-hosting-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
