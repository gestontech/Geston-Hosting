name: Geston Hosting - Liquid Glass Menus

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  liquid-glass-menus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply light Liquid Glass menu styles
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          css_path = Path("src/index.css")
          css = css_path.read_text(encoding="utf-8")

          marker_start = "/* GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS START */"
          marker_end = "/* GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS END */"

          if marker_start in css and marker_end in css:
              print("Light Liquid Glass menu styles already present.")
              raise SystemExit(0)

          block = r'''
          /* GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS START */

          /*
           * Menus latéraux Client + Admin.
           * Mode clair uniquement.
           * Le mode sombre existant n'est pas modifié.
           */

          html.light .geston-menu-glass {
            background:
              linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.72),
                rgba(255, 255, 255, 0.34)
              ) !important;

            border-right-color: rgba(255, 255, 255, 0.72) !important;

            box-shadow:
              8px 0 34px rgba(15, 23, 42, 0.08),
              inset -1px 0 0 rgba(255, 255, 255, 0.78);

            backdrop-filter:
              blur(34px)
              saturate(175%);

            -webkit-backdrop-filter:
              blur(34px)
              saturate(175%);
          }

          html.light .geston-menu-option {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.42),
                rgba(255, 255, 255, 0.16)
              ) !important;

            border: 1px solid rgba(255, 255, 255, 0.48) !important;

            box-shadow:
              0 4px 14px rgba(15, 23, 42, 0.035),
              inset 0 1px 0 rgba(255, 255, 255, 0.72) !important;

            color: hsl(222 30% 12%) !important;

            backdrop-filter:
              blur(22px)
              saturate(165%);

            -webkit-backdrop-filter:
              blur(22px)
              saturate(165%);
          }

          html.light .geston-menu-option:hover {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.62),
                rgba(255, 255, 255, 0.26)
              ) !important;

            box-shadow:
              0 6px 18px rgba(15, 23, 42, 0.055),
              inset 0 1px 0 rgba(255, 255, 255, 0.82) !important;

            color: hsl(222 30% 8%) !important;
          }

          html.light .geston-menu-glass .border-border,
          html.light .geston-menu-glass .border-border\/50 {
            border-color: rgba(255, 255, 255, 0.48) !important;
          }

          html.light .geston-menu-glass .bg-muted\/50 {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.44),
                rgba(255, 255, 255, 0.18)
              ) !important;

            border-color: rgba(255, 255, 255, 0.48) !important;

            box-shadow:
              inset 0 1px 0 rgba(255, 255, 255, 0.72),
              0 4px 14px rgba(15, 23, 42, 0.035);
          }

          html.light .geston-mobile-menu {
            background:
              linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.72),
                rgba(255, 255, 255, 0.34)
              ) !important;

            border-top-color: rgba(255, 255, 255, 0.72) !important;

            box-shadow:
              0 -10px 34px rgba(15, 23, 42, 0.08),
              inset 0 1px 0 rgba(255, 255, 255, 0.78);

            backdrop-filter:
              blur(34px)
              saturate(175%);

            -webkit-backdrop-filter:
              blur(34px)
              saturate(175%);
          }

          /* GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS END */
          '''

          css = css.rstrip() + "\n\n" + block.strip() + "\n"
          css_path.write_text(css, encoding="utf-8")

          print("Light Liquid Glass side-menu styles applied.")
          PY

      - name: Verify CSS marker
        run: |
          grep -q "GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS START" src/index.css
          grep -q "GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS END" src/index.css
          echo "CSS verification passed."

      - name: Build application
        run: npm run build

      - name: Commit and push changes
        shell: bash
        run: |
          git status --short

          if git diff --quiet -- src/index.css; then
            echo "No CSS changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/index.css
          git commit -m "Improve light Liquid Glass side menus"
          git push origin HEAD:main
