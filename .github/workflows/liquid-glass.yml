name: Apply Liquid Glass Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liquid-glass:
    name: Apply Liquid Glass safely
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Liquid Glass to side menus
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              "src/pages/Home.tsx",
              "src/pages/MyBots.tsx",
              "src/pages/MyPanels.tsx",
              "src/pages/ServicesPanel.tsx",
              "src/pages/ServicesBots.tsx",
              "src/pages/Tutorials.tsx",
              "src/pages/Contact.tsx",
              "src/pages/PurchasePanels.tsx",
              "src/pages/Dashboard.tsx",
              "src/pages/Admin.tsx",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"Fichier absent, ignoré : {filename}")
                  continue

              content = path.read_text(encoding="utf-8")
              original = content

              # Menu mobile de Home.
              content = content.replace(
                  "lg:hidden border-t border-border bg-background px-4 py-3 space-y-1",
                  "lg:hidden liquid-glass border-t border-white/15 px-4 py-3 space-y-2"
              )

              # Boutons du menu mobile Home.
              content = content.replace(
                  "px-3 py-2.5 rounded-lg text-sm text-muted-foreground hover:bg-muted hover:text-foreground",
                  "px-3 py-2.5 rounded-xl liquid-glass-subtle text-sm text-muted-foreground hover:bg-white/10 hover:text-foreground transition-all"
              )

              # Menus latéraux.
              content = content.replace(
                  "bg-card border-r border-border",
                  "liquid-glass border-r border-white/15"
              )

              # Cartes individuelles des options.
              content = content.replace(
                  "px-3 py-2.5 rounded-lg text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-all",
                  "px-3 py-2.5 rounded-xl liquid-glass-subtle text-sm font-medium text-muted-foreground hover:bg-white/10 hover:text-foreground transition-all"
              )

              # Autres variantes de boutons de navigation.
              content = content.replace(
                  "px-3 py-2.5 rounded-lg text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-all",
                  "px-3 py-2.5 rounded-xl liquid-glass-subtle text-sm text-muted-foreground hover:bg-white/10 hover:text-foreground transition-all"
              )

              # Évite les anciens états visuels opaques.
              content = content.replace(
                  "hover:bg-muted",
                  "hover:bg-white/10"
              )

              if content != original:
                  path.write_text(content, encoding="utf-8")
                  print(f"Liquid Glass appliqué : {filename}")
              else:
                  print(f"Aucun changement nécessaire : {filename}")
          PY

      - name: Verify Liquid Glass side menus
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              "src/pages/Home.tsx",
              "src/pages/MyBots.tsx",
              "src/pages/MyPanels.tsx",
              "src/pages/ServicesPanel.tsx",
              "src/pages/ServicesBots.tsx",
              "src/pages/Tutorials.tsx",
              "src/pages/Contact.tsx",
              "src/pages/PurchasePanels.tsx",
              "src/pages/Dashboard.tsx",
              "src/pages/Admin.tsx",
          ]

          checked = 0

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  continue

              content = path.read_text(encoding="utf-8")

              if "liquid-glass" in content:
                  checked += 1
                  print(f"OK : {filename}")

          if checked == 0:
              raise SystemExit(
                  "ERREUR : aucun menu Liquid Glass détecté."
              )

          print(f"{checked} fichier(s) vérifié(s).")
          PY

      - name: Check formatting
        run: git diff --check

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Show changes
        run: git diff --stat

      - name: Commit and push only if everything passed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/index.css \
            src/pages/Home.tsx \
            src/pages/MyBots.tsx \
            src/pages/MyPanels.tsx \
            src/pages/ServicesPanel.tsx \
            src/pages/ServicesBots.tsx \
            src/pages/Tutorials.tsx \
            src/pages/Contact.tsx \
            src/pages/PurchasePanels.tsx \
            src/pages/Dashboard.tsx \
            src/pages/Admin.tsx

          git commit -m "Apply Liquid Glass side menu cards"
          git push origin main
