name: Apply Liquid Glass Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liquid-glass:
    name: Apply Liquid Glass menu safely
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply menu-only Liquid Glass
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              "src/pages/Home.tsx",
              "src/pages/MyBots.tsx",
              "src/pages/MyPanels.tsx",
              "src/pages/ServicesPanel.tsx",
              "src/pages/ServicesBots.tsx",
              "src/pages/Tutorials.tsx",
              "src/pages/Contact.tsx",
              "src/pages/PurchasePanels.tsx",
              "src/pages/Dashboard.tsx",
              "src/pages/Admin.tsx",
          ]

          # =========================================================
          # CSS : uniquement les menus
          # =========================================================

          css_path = Path("src/index.css")
          css = css_path.read_text(encoding="utf-8")

          marker = re.compile(
              r"/\*\s*GESTON HOSTING — MENU LIQUID GLASS START\s*\*/"
              r".*?"
              r"/\*\s*GESTON HOSTING — MENU LIQUID GLASS END\s*\*/",
              re.DOTALL,
          )

          css = marker.sub("", css).rstrip()

          menu_css = r"""
          /* =========================================================
             GESTON HOSTING — MENU LIQUID GLASS START
             ========================================================= */

          /*
           * Le panneau utilise le même langage visuel que le menu Admin.
           * Les options n'ont volontairement PAS de bordure individuelle.
           */

          .geston-menu-glass {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.075),
                rgba(255, 255, 255, 0.018)
              );

            border-color: rgba(255, 255, 255, 0.12);

            box-shadow:
              8px 0 32px rgba(0, 0, 0, 0.08),
              inset -1px 0 0 rgba(255, 255, 255, 0.08);

            backdrop-filter:
              blur(32px)
              saturate(170%);

            -webkit-backdrop-filter:
              blur(32px)
              saturate(170%);
          }

          /*
           * Option de menu :
           * - pas de contour
           * - pas de carte individuelle
           * - petit espace entre les lignes
           * - comportement visuel proche du menu Admin
           */

          .geston-menu-option {
            border: 0 !important;
            outline: none !important;
            box-shadow: none !important;

            background: transparent;

            color: hsl(var(--foreground));

            border-radius: 0.65rem;

            margin-bottom: 4px;

            transition:
              background-color 160ms ease,
              color 160ms ease;
          }

          .geston-menu-option:hover {
            background:
              rgba(255, 255, 255, 0.075);

            color: hsl(var(--foreground));
          }

          .geston-menu-option[aria-current="page"],
          .geston-menu-option[data-active="true"] {
            background:
              rgba(255, 255, 255, 0.10);

            color: hsl(var(--foreground));
          }

          /*
           * Texte et icônes héritent du foreground du thème.
           * Cela évite les textes trop sombres en dark mode
           * et les textes trop clairs en light mode.
           */

          .geston-menu-option svg {
            color: currentColor;
            opacity: 0.92;
          }

          .geston-menu-option span,
          .geston-menu-option div {
            color: inherit;
          }

          /*
           * Mode clair : contraste lisible.
           */

          html.light .geston-menu-option {
            color: hsl(222 30% 12%);
          }

          html.light .geston-menu-option:hover {
            background:
              rgba(0, 0, 0, 0.055);

            color: hsl(222 30% 10%);
          }

          /*
           * Mode sombre : contraste lisible.
           */

          html.dark .geston-menu-option {
            color: hsl(0 0% 96%);
          }

          html.dark .geston-menu-option:hover {
            background:
              rgba(255, 255, 255, 0.075);

            color: hsl(0 0% 100%);
          }

          /*
           * Menu mobile / menu principal.
           */

          .geston-mobile-menu {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.075),
                rgba(255, 255, 255, 0.018)
              );

            backdrop-filter:
              blur(32px)
              saturate(170%);

            -webkit-backdrop-filter:
              blur(32px)
              saturate(170%);
          }

          /* =========================================================
             GESTON HOSTING — MENU LIQUID GLASS END
             ========================================================= */
          """

          css += "\n\n" + menu_css.strip() + "\n"
          css_path.write_text(css, encoding="utf-8")

          # =========================================================
          # TSX : classes visuelles uniquement
          # =========================================================

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"Fichier absent : {filename}")
                  continue

              content = path.read_text(encoding="utf-8")
              original = content

              # -----------------------------------------------------
              # Anciennes cartes individuelles :
              # on les transforme en simples options comme Admin.
              # -----------------------------------------------------

              content = content.replace(
                  "sidebar-glass-item",
                  "geston-menu-option"
              )

              # Ancienne classe de panneau.
              content = content.replace(
                  "sidebar-glass-panel",
                  "geston-menu-glass"
              )

              # Ancienne classe mobile.
              content = content.replace(
                  "sidebar-glass-mobile",
                  "geston-mobile-menu"
              )

              # -----------------------------------------------------
              # Si certaines options utilisent encore les anciennes
              # classes Liquid Glass, on retire seulement leur
              # apparence individuelle.
              # -----------------------------------------------------

              content = content.replace(
                  "liquid-glass-subtle",
                  ""
              )

              # -----------------------------------------------------
              # Anciennes bordures/classes d'options.
              # -----------------------------------------------------

              content = content.replace(
                  "hover:bg-muted",
                  "hover:bg-black/5 dark:hover:bg-white/10"
              )

              # -----------------------------------------------------
              # Ajouter la classe visuelle à certains boutons de menu
              # qui utilisent encore px-3 py-2.5.
              # -----------------------------------------------------

              patterns = [
                  r'className="([^"]*px-3 py-2\.5[^"]*)"',
                  r"className='([^']*px-3 py-2\.5[^']*)'",
              ]

              for pattern in patterns:
                  def replace_class(match):
                      classes = match.group(1)

                      # Ne pas toucher aux éléments qui ne ressemblent
                      # pas à une option de menu.
                      if "geston-menu-option" in classes:
                          return match.group(0)

                      if (
                          "nav" in classes
                          or "muted-foreground" in classes
                          or "ChevronRight" in classes
                      ):
                          classes = classes.replace(
                              "rounded-lg",
                              "rounded-xl"
                          )

                          classes += " geston-menu-option"

                          return f'className="{classes}"'

                      return match.group(0)

                  content = re.sub(pattern, replace_class, content)

              # -----------------------------------------------------
              # Nav : petit espace entre les options, sans cartes.
              # -----------------------------------------------------

              content = content.replace(
                  'className="space-y-0.5 flex-1"',
                  'className="space-y-1 flex-1"'
              )

              content = content.replace(
                  'className="space-y-1 flex-1"',
                  'className="space-y-1 flex-1"'
              )

              if content != original:
                  path.write_text(content, encoding="utf-8")
                  print(f"Menu mis à jour : {filename}")
              else:
                  print(f"Aucun changement nécessaire : {filename}")

          PY

      - name: Verify menu-only changes
        shell: bash
        run: |
          grep -q "GESTON HOSTING — MENU LIQUID GLASS START" src/index.css
          grep -q "geston-menu-option" src/index.css
          grep -q "geston-menu-glass" src/index.css

          echo "Menu Liquid Glass vérifié."

      - name: Check formatting
        run: git diff --check

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Show changes
        run: |
          echo "===== MODIFICATIONS ====="
          git diff --stat

          echo "===== FICHIERS MODIFIÉS ====="
          git diff --name-only

      - name: Commit and push only after successful verification
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucun changement à pousser."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/index.css
          git add src/pages/Home.tsx
          git add src/pages/MyBots.tsx
          git add src/pages/MyPanels.tsx
          git add src/pages/ServicesPanel.tsx
          git add src/pages/ServicesBots.tsx
          git add src/pages/Tutorials.tsx
          git add src/pages/Contact.tsx
          git add src/pages/PurchasePanels.tsx
          git add src/pages/Dashboard.tsx
          git add src/pages/Admin.tsx

          git commit -m "Match menus to Admin Liquid Glass style"
          git push origin main
