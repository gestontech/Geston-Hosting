name: Apply Liquid Glass Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liquid-glass:
    name: Apply transparent Liquid Glass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply global transparent Liquid Glass
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # =========================================================
          # GLOBAL LIQUID GLASS
          # =========================================================

          css_path = Path("src/index.css")
          css = css_path.read_text(encoding="utf-8")

          # Supprimer les blocs gérés précédemment par cette Action.
          patterns = [
              re.compile(
                  r"/\*\s*GESTON HOSTING — GLOBAL LIQUID GLASS START\s*\*/"
                  r".*?"
                  r"/\*\s*GESTON HOSTING — GLOBAL LIQUID GLASS END\s*\*/",
                  re.DOTALL,
              ),
              re.compile(
                  r"/\*\s*GESTON HOSTING — SIDEBAR LIQUID GLASS START\s*\*/"
                  r".*?"
                  r"/\*\s*GESTON HOSTING — SIDEBAR LIQUID GLASS END\s*\*/",
                  re.DOTALL,
              ),
          ]

          for pattern in patterns:
              css = pattern.sub("", css)

          css = css.rstrip()

          liquid_glass = r"""
          /* =========================================================
             GESTON HOSTING — GLOBAL LIQUID GLASS START
             ========================================================= */

          @layer components {

            /* -------------------------------------------------------
               Surface principale
               ------------------------------------------------------- */

            .liquid-glass {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.115),
                  rgba(255, 255, 255, 0.025)
                ) !important;

              border: 1px solid rgba(255, 255, 255, 0.14);

              box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.07),
                inset 0 1px 0 rgba(255, 255, 255, 0.20);

              backdrop-filter:
                blur(30px)
                saturate(175%);

              -webkit-backdrop-filter:
                blur(30px)
                saturate(175%);
            }

            /* -------------------------------------------------------
               Surface secondaire
               ------------------------------------------------------- */

            .liquid-glass-subtle {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.075),
                  rgba(255, 255, 255, 0.018)
                ) !important;

              border: 1px solid rgba(255, 255, 255, 0.105);

              box-shadow:
                0 5px 22px rgba(0, 0, 0, 0.055),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);

              backdrop-filter:
                blur(26px)
                saturate(165%);

              -webkit-backdrop-filter:
                blur(26px)
                saturate(165%);
            }

            /* -------------------------------------------------------
               Cartes individuelles du menu
               ------------------------------------------------------- */

            .sidebar-glass-item {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.095),
                  rgba(255, 255, 255, 0.022)
                ) !important;

              border: 1px solid rgba(255, 255, 255, 0.13);

              box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.065),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);

              backdrop-filter:
                blur(28px)
                saturate(170%);

              -webkit-backdrop-filter:
                blur(28px)
                saturate(170%);

              transition:
                background 180ms ease,
                box-shadow 180ms ease,
                transform 180ms ease;
            }

            .sidebar-glass-item:hover {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.14),
                  rgba(255, 255, 255, 0.035)
                ) !important;

              box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.09),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
            }

            .sidebar-glass-list {
              display: flex;
              flex-direction: column;
              gap: 6px;
            }

            /* -------------------------------------------------------
               Panneau du menu latéral
               ------------------------------------------------------- */

            .sidebar-glass-panel {
              background:
                linear-gradient(
                  145deg,
                  rgba(255, 255, 255, 0.085),
                  rgba(255, 255, 255, 0.018)
                ) !important;

              border-right: 1px solid rgba(255, 255, 255, 0.14);

              box-shadow:
                8px 0 34px rgba(0, 0, 0, 0.08),
                inset -1px 0 0 rgba(255, 255, 255, 0.10);

              backdrop-filter:
                blur(34px)
                saturate(175%);

              -webkit-backdrop-filter:
                blur(34px)
                saturate(175%);
            }

            /* -------------------------------------------------------
               Menu mobile
               ------------------------------------------------------- */

            .sidebar-glass-mobile {
              background:
                linear-gradient(
                  145deg,
                  rgba(255, 255, 255, 0.09),
                  rgba(255, 255, 255, 0.02)
                ) !important;

              border-top: 1px solid rgba(255, 255, 255, 0.13);

              box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);

              backdrop-filter:
                blur(34px)
                saturate(175%);

              -webkit-backdrop-filter:
                blur(34px)
                saturate(175%);
            }

            /* -------------------------------------------------------
               Icônes
               ------------------------------------------------------- */

            .liquid-glass-icon {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.13),
                  rgba(255, 255, 255, 0.025)
                );

              border: 1px solid rgba(255, 255, 255, 0.13);

              box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.055),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);

              backdrop-filter:
                blur(22px)
                saturate(165%);

              -webkit-backdrop-filter:
                blur(22px)
                saturate(165%);

              border-radius: 10px;
            }

            /* -------------------------------------------------------
               Champs
               ------------------------------------------------------- */

            input,
            textarea,
            select {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.075),
                  rgba(255, 255, 255, 0.018)
                ) !important;

              border-color: rgba(255, 255, 255, 0.13) !important;

              backdrop-filter:
                blur(26px)
                saturate(165%);

              -webkit-backdrop-filter:
                blur(26px)
                saturate(165%);
            }

            /* -------------------------------------------------------
               Fenêtres, menus et overlays
               ------------------------------------------------------- */

            [role="dialog"],
            [role="menu"],
            [role="listbox"],
            [data-radix-popper-content-wrapper] > * {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.105),
                  rgba(255, 255, 255, 0.025)
                ) !important;

              border: 1px solid rgba(255, 255, 255, 0.13);

              box-shadow:
                0 12px 38px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);

              backdrop-filter:
                blur(32px)
                saturate(175%);

              -webkit-backdrop-filter:
                blur(32px)
                saturate(175%);
            }
          }

          /* =========================================================
             MODE CLAIR
             ========================================================= */

          html.light .liquid-glass {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.30),
                rgba(255, 255, 255, 0.075)
              ) !important;

            border-color: rgba(255, 255, 255, 0.34);
          }

          html.light .liquid-glass-subtle {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.22),
                rgba(255, 255, 255, 0.045)
              ) !important;

            border-color: rgba(255, 255, 255, 0.28);
          }

          html.light .sidebar-glass-item {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.27),
                rgba(255, 255, 255, 0.055)
              ) !important;

            border-color: rgba(255, 255, 255, 0.31);
          }

          /* =========================================================
             MODE SOMBRE
             ========================================================= */

          html.dark .liquid-glass {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.075),
                rgba(255, 255, 255, 0.012)
              ) !important;

            border-color: rgba(255, 255, 255, 0.10);
          }

          html.dark .liquid-glass-subtle {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.055),
                rgba(255, 255, 255, 0.008)
              ) !important;

            border-color: rgba(255, 255, 255, 0.075);
          }

          html.dark .sidebar-glass-item {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.065),
                rgba(255, 255, 255, 0.01)
              ) !important;

            border-color: rgba(255, 255, 255, 0.09);
          }

          /* =========================================================
             ACCESSIBILITÉ
             ========================================================= */

          @media (prefers-reduced-motion: reduce) {
            .liquid-glass,
            .liquid-glass-subtle,
            .sidebar-glass-item {
              transition: none !important;
            }
          }

          @supports not (backdrop-filter: blur(1px)) {
            .liquid-glass,
            .liquid-glass-subtle,
            .sidebar-glass-item,
            .sidebar-glass-panel,
            .sidebar-glass-mobile {
              background: hsl(var(--card)) !important;
            }
          }

          /* =========================================================
             GESTON HOSTING — GLOBAL LIQUID GLASS END
             ========================================================= */
          """

          css = css + "\n\n" + liquid_glass.strip() + "\n"
          css_path.write_text(css, encoding="utf-8")

          # =========================================================
          # MENUS LATÉRAUX
          # =========================================================

          files = [
              "src/pages/Home.tsx",
              "src/pages/MyBots.tsx",
              "src/pages/MyPanels.tsx",
              "src/pages/ServicesPanel.tsx",
              "src/pages/ServicesBots.tsx",
              "src/pages/Tutorials.tsx",
              "src/pages/Contact.tsx",
              "src/pages/PurchasePanels.tsx",
              "src/pages/Dashboard.tsx",
              "src/pages/Admin.tsx",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"Fichier absent : {filename}")
                  continue

              content = path.read_text(encoding="utf-8")

              # Panneau latéral.
              content = content.replace(
                  "bg-card border-r border-border",
                  "sidebar-glass-panel border-r border-white/15"
              )

              # Ancienne classe éventuelle.
              content = content.replace(
                  "liquid-glass border-r border-white/15",
                  "sidebar-glass-panel border-r border-white/15"
              )

              # Options du menu.
              content = content.replace(
                  "liquid-glass-subtle text-sm font-medium text-muted-foreground hover:bg-white/10 hover:text-foreground transition-all",
                  "sidebar-glass-item text-sm font-medium text-muted-foreground hover:text-foreground transition-all"
              )

              content = content.replace(
                  "liquid-glass-subtle text-sm text-muted-foreground hover:bg-white/10 hover:text-foreground transition-all",
                  "sidebar-glass-item text-sm text-muted-foreground hover:text-foreground transition-all"
              )

              # Anciennes options.
              content = content.replace(
                  "px-3 py-2.5 rounded-lg text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-all",
                  "px-3 py-2.5 rounded-xl sidebar-glass-item text-sm font-medium text-muted-foreground hover:text-foreground transition-all"
              )

              content = content.replace(
                  "px-3 py-2.5 rounded-lg text-sm text-muted-foreground hover:bg-muted hover:text-foreground",
                  "px-3 py-2.5 rounded-xl sidebar-glass-item text-sm text-muted-foreground hover:text-foreground transition-all"
              )

              # Menu mobile.
              content = content.replace(
                  "lg:hidden border-t border-border bg-background px-4 py-3 space-y-1",
                  "lg:hidden sidebar-glass-mobile border-t border-white/15 px-4 py-3 space-y-2"
              )

              content = content.replace(
                  "lg:hidden liquid-glass border-t border-white/15 px-4 py-3 space-y-2",
                  "lg:hidden sidebar-glass-mobile border-t border-white/15 px-4 py-3 space-y-2"
              )

              # Options mobiles.
              content = content.replace(
                  "rounded-lg text-sm text-muted-foreground hover:bg-muted hover:text-foreground",
                  "rounded-xl sidebar-glass-item text-sm text-muted-foreground hover:text-foreground transition-all"
              )

              # Espacement vertical.
              content = content.replace(
                  '<nav className="space-y-0.5 flex-1">',
                  '<nav className="sidebar-glass-list flex-1">'
              )

              path.write_text(content, encoding="utf-8")
              print(f"Liquid Glass appliqué : {filename}")
          PY

      - name: Verify Liquid Glass
        shell: bash
        run: |
          grep -q "GESTON HOSTING — GLOBAL LIQUID GLASS START" src/index.css
          grep -q "sidebar-glass-item" src/index.css
          grep -q "sidebar-glass-panel" src/index.css
          grep -q "backdrop-filter" src/index.css

          echo "Liquid Glass global vérifié."

      - name: Check formatting
        run: git diff --check

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Show changes
        run: git diff --stat

      - name: Commit and push only if everything passed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/index.css \
            src/pages/Home.tsx \
            src/pages/MyBots.tsx \
            src/pages/MyPanels.tsx \
            src/pages/ServicesPanel.tsx \
            src/pages/ServicesBots.tsx \
            src/pages/Tutorials.tsx \
            src/pages/Contact.tsx \
            src/pages/PurchasePanels.tsx \
            src/pages/Dashboard.tsx \
            src/pages/Admin.tsx

          git commit -m "Apply transparent Liquid Glass globally"
          git push origin main
