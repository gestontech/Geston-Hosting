name: Apply Liquid Glass Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liquid-glass:
    name: Replace visual theme with Liquid Glass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replace Liquid Glass theme
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/index.css")
          css = path.read_text(encoding="utf-8")

          START = "/* GESTON HOSTING — LIQUID GLASS THEME */"
          END = "/* END LIQUID GLASS THEME */"

          # Supprime uniquement l'ancien bloc Liquid Glass.
          pattern = re.compile(
              re.escape(START) + r".*?" + re.escape(END),
              re.DOTALL,
          )

          css = pattern.sub("", css).rstrip()

          liquid_glass = r"""
          /* =========================================================
             GESTON HOSTING — LIQUID GLASS THEME
             ========================================================= */

          html {
            color-scheme: light dark;
          }

          html.light {
            color-scheme: light;
          }

          html.dark {
            color-scheme: dark;
          }

          html,
          body {
            background:
              radial-gradient(
                circle at 15% 10%,
                rgba(80, 200, 140, 0.14),
                transparent 35%
              ),
              radial-gradient(
                circle at 85% 20%,
                rgba(100, 180, 255, 0.12),
                transparent 35%
              ),
              hsl(var(--background));
          }

          @layer components {

            .liquid-glass {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.16),
                  rgba(255, 255, 255, 0.05)
                );
              border: 1px solid rgba(255, 255, 255, 0.16);
              box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
              backdrop-filter: blur(24px) saturate(150%);
              -webkit-backdrop-filter: blur(24px) saturate(150%);
            }

            .liquid-glass-subtle {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.12),
                  rgba(255, 255, 255, 0.035)
                );
              border: 1px solid rgba(255, 255, 255, 0.13);
              box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
              backdrop-filter: blur(20px) saturate(145%);
              -webkit-backdrop-filter: blur(20px) saturate(145%);
            }
          }

          /* Surfaces qui n'utilisent pas encore .liquid-glass */
          input,
          textarea,
          select {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.12),
                rgba(255, 255, 255, 0.04)
              );
            border-color: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
          }

          html.light input,
          html.light textarea,
          html.light select {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.78),
                rgba(255, 255, 255, 0.42)
              );
            border-color: rgba(255, 255, 255, 0.78);
          }

          [role="dialog"],
          [role="menu"],
          [role="listbox"],
          [data-radix-popper-content-wrapper] > * {
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
          }

          @supports not (backdrop-filter: blur(1px)) {
            .liquid-glass,
            .liquid-glass-subtle {
              background: hsl(var(--card));
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .liquid-glass,
            .liquid-glass-subtle,
            input,
            textarea,
            select {
              backdrop-filter: none;
              -webkit-backdrop-filter: none;
            }
          }

          /* =========================================================
             END LIQUID GLASS THEME
             ========================================================= */
          """

          css = css.rstrip() + "\n\n" + liquid_glass.strip() + "\n"

          path.write_text(css, encoding="utf-8")
          PY

      - name: Verify Liquid Glass
        shell: bash
        run: |
          grep -q "GESTON HOSTING — LIQUID GLASS THEME" src/index.css
          grep -q "END LIQUID GLASS THEME" src/index.css

          count_start=$(grep -c "GESTON HOSTING — LIQUID GLASS THEME" src/index.css)
          count_end=$(grep -c "END LIQUID GLASS THEME" src/index.css)

          test "$count_start" -eq 1
          test "$count_end" -eq 1

          echo "Liquid Glass block verified."

      - name: Check formatting
        run: git diff --check

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Show changes
        run: git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/index.css
          git commit -m "Replace theme with Liquid Glass"
          git push origin main
