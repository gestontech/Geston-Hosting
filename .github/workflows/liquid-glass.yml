name: Apply Liquid Glass Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liquid-glass:
    name: Improve light menu contrast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Improve light mode menus only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          css_path = Path("src/index.css")
          css = css_path.read_text(encoding="utf-8")

          # Supprimer uniquement notre ancien bloc de correction
          # des menus clair afin d'éviter les doublons.
          pattern = re.compile(
              r"/\*\s*GESTON HOSTING — LIGHT MENUS CONTRAST START\s*\*/"
              r".*?"
              r"/\*\s*GESTON HOSTING — LIGHT MENUS CONTRAST END\s*\*/",
              re.DOTALL,
          )

          css = pattern.sub("", css).rstrip()

          light_menu_css = r"""
          /* =========================================================
             GESTON HOSTING — LIGHT MENUS CONTRAST START
             ========================================================= */

          /*
           * MODE CLAIR UNIQUEMENT
           *
           * Le mode sombre n'est volontairement pas défini ici.
           * Les règles existantes du mode sombre restent intactes.
           */

          html.light .geston-menu-glass {
            background:
              rgba(255, 255, 255, 0.94) !important;

            border-right-color:
              rgba(0, 0, 0, 0.08);

            box-shadow:
              8px 0 32px rgba(0, 0, 0, 0.08),
              inset -1px 0 0 rgba(255, 255, 255, 0.90);

            backdrop-filter:
              blur(24px)
              saturate(150%);

            -webkit-backdrop-filter:
              blur(24px)
              saturate(150%);

            color:
              hsl(222 30% 12%);
          }

          /*
           * Même rendu blanc pour le menu principal/mobile
           * en mode clair.
           */

          html.light .geston-mobile-menu {
            background:
              rgba(255, 255, 255, 0.94) !important;

            border-top-color:
              rgba(0, 0, 0, 0.08);

            box-shadow:
              0 10px 32px rgba(0, 0, 0, 0.08),
              inset 0 1px 0 rgba(255, 255, 255, 0.90);

            backdrop-filter:
              blur(24px)
              saturate(150%);

            -webkit-backdrop-filter:
              blur(24px)
              saturate(150%);
          }

          /*
           * OPTIONS DES MENUS — MODE CLAIR
           *
           * Aucun contour individuel.
           * Les options gardent le style du menu Admin.
           */

          html.light .geston-menu-option {
            background:
              transparent !important;

            border:
              0 !important;

            outline:
              none !important;

            box-shadow:
              none !important;

            color:
              hsl(222 30% 12%) !important;

            text-shadow:
              none;
          }

          html.light .geston-menu-option:hover {
            background:
              rgba(0, 0, 0, 0.055) !important;

            color:
              hsl(222 30% 8%) !important;
          }

          /*
           * Texte et icônes héritent du même contraste.
           */

          html.light .geston-menu-option svg {
            color:
              currentColor !important;

            opacity:
              0.95;
          }

          html.light .geston-menu-option span,
          html.light .geston-menu-option div {
            color:
              inherit;
          }

          /*
           * Sections secondaires du menu.
           */

          html.light .geston-menu-glass .text-muted-foreground,
          html.light .geston-mobile-menu .text-muted-foreground {
            color:
              hsl(215 16% 38%) !important;
          }

          /*
           * Le mode sombre n'est PAS redéfini.
           * Les règles html.dark existantes restent inchangées.
           */

          /* =========================================================
             GESTON HOSTING — LIGHT MENUS CONTRAST END
             ========================================================= */
          """

          css += "\n\n" + light_menu_css.strip() + "\n"

          css_path.write_text(css, encoding="utf-8")

          print("Correction du mode clair des menus appliquée.")
          print("Aucune règle html.dark ajoutée ou modifiée.")

          # Vérification de sécurité :
          # le bloc ne doit contenir aucune règle html.dark.
          if "html.dark" in light_menu_css:
              raise SystemExit(
                  "ERREUR : une règle dark a été introduite."
              )
          PY

      - name: Verify light menu correction
        shell: bash
        run: |
          grep -q "GESTON HOSTING — LIGHT MENUS CONTRAST START" src/index.css
          grep -q "html.light .geston-menu-glass" src/index.css
          grep -q "html.light .geston-menu-option" src/index.css

          echo "Menus Admin/Client en mode clair vérifiés."

      - name: Verify no dark-mode rule was added
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          css = Path("src/index.css").read_text(encoding="utf-8")

          match = re.search(
              r"/\*\s*GESTON HOSTING — LIGHT MENUS CONTRAST START\s*\*/"
              r"(.*?)"
              r"/\*\s*GESTON HOSTING — LIGHT MENUS CONTRAST END\s*\*/",
              css,
              re.DOTALL,
          )

          if not match:
              raise SystemExit(
                  "Bloc de correction introuvable."
              )

          block = match.group(1)

          if "html.dark" in block:
              raise SystemExit(
                  "ERREUR : le mode sombre a été touché."
              )

          print("OK : aucune règle dark dans la correction.")
          PY

      - name: Check formatting
        run: git diff --check

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Show changes
        run: |
          echo "===== MODIFICATIONS ====="
          git diff --stat

          echo "===== FICHIERS MODIFIÉS ====="
          git diff --name-only

      - name: Commit and push only after successful verification
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/index.css

          git commit -m "Improve light menu contrast"

          git push origin main
