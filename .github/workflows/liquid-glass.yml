name: Apply Liquid Glass Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liquid-glass:
    name: Apply Liquid Glass safely
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply stronger Liquid Glass
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # ---------------------------------------------------------
          # 1. Renforcer le Liquid Glass global
          # ---------------------------------------------------------
          css_path = Path("src/index.css")
          css = css_path.read_text(encoding="utf-8")

          # Supprimer l'ancien bloc géré par cette Action.
          managed = re.compile(
              r"/\*\s*GESTON HOSTING — SIDEBAR LIQUID GLASS START\s*\*/"
              r".*?"
              r"/\*\s*GESTON HOSTING — SIDEBAR LIQUID GLASS END\s*\*/",
              re.DOTALL,
          )

          css = managed.sub("", css).rstrip()

          sidebar_css = r"""
          /* GESTON HOSTING — SIDEBAR LIQUID GLASS START */

          @layer components {

            /* Carte individuelle de chaque option du menu */
            .sidebar-glass-item {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.22),
                  rgba(255, 255, 255, 0.07)
                );
              border: 1px solid rgba(255, 255, 255, 0.22);
              box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
              backdrop-filter: blur(26px) saturate(165%);
              -webkit-backdrop-filter: blur(26px) saturate(165%);
              transition:
                background 180ms ease,
                box-shadow 180ms ease,
                transform 180ms ease;
            }

            .sidebar-glass-item:hover {
              background:
                linear-gradient(
                  135deg,
                  rgba(255, 255, 255, 0.28),
                  rgba(255, 255, 255, 0.10)
                );
              box-shadow:
                0 7px 22px rgba(0, 0, 0, 0.13),
                inset 0 1px 0 rgba(255, 255, 255, 0.34);
            }

            /* Espace entre les petites cartes */
            .sidebar-glass-list {
              display: flex;
              flex-direction: column;
              gap: 6px;
            }

            /* Surface principale du menu */
            .sidebar-glass-panel {
              background:
                linear-gradient(
                  145deg,
                  rgba(255, 255, 255, 0.18),
                  rgba(255, 255, 255, 0.055)
                );
              border-right: 1px solid rgba(255, 255, 255, 0.20);
              box-shadow:
                8px 0 35px rgba(0, 0, 0, 0.12),
                inset -1px 0 0 rgba(255, 255, 255, 0.12);
              backdrop-filter: blur(30px) saturate(170%);
              -webkit-backdrop-filter: blur(30px) saturate(170%);
            }

            /* Menu mobile */
            .sidebar-glass-mobile {
              background:
                linear-gradient(
                  145deg,
                  rgba(255, 255, 255, 0.20),
                  rgba(255, 255, 255, 0.06)
                );
              border-top: 1px solid rgba(255, 255, 255, 0.18);
              box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.20);
              backdrop-filter: blur(30px) saturate(170%);
              -webkit-backdrop-filter: blur(30px) saturate(170%);
            }
          }

          html.dark .sidebar-glass-item {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.12),
                rgba(255, 255, 255, 0.035)
              );
            border-color: rgba(255, 255, 255, 0.13);
            box-shadow:
              0 6px 20px rgba(0, 0, 0, 0.28),
              inset 0 1px 0 rgba(255, 255, 255, 0.16);
          }

          html.dark .sidebar-glass-item:hover {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.17),
                rgba(255, 255, 255, 0.055)
              );
          }

          @media (prefers-reduced-motion: reduce) {
            .sidebar-glass-item {
              transition: none;
            }
          }

          /* GESTON HOSTING — SIDEBAR LIQUID GLASS END */
          """

          css = css + "\n\n" + sidebar_css.strip() + "\n"
          css_path.write_text(css, encoding="utf-8")

          # ---------------------------------------------------------
          # 2. Modifier uniquement l'apparence des menus latéraux
          # ---------------------------------------------------------
          files = [
              "src/pages/Home.tsx",
              "src/pages/MyBots.tsx",
              "src/pages/MyPanels.tsx",
              "src/pages/ServicesPanel.tsx",
              "src/pages/ServicesBots.tsx",
              "src/pages/Tutorials.tsx",
              "src/pages/Contact.tsx",
              "src/pages/PurchasePanels.tsx",
              "src/pages/Dashboard.tsx",
              "src/pages/Admin.tsx",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"Fichier absent : {filename}")
                  continue

              content = path.read_text(encoding="utf-8")

              # Menu latéral principal.
              content = content.replace(
                  "liquid-glass border-r border-white/15",
                  "sidebar-glass-panel border-r border-white/15"
              )

              # Menus mobiles.
              content = content.replace(
                  "lg:hidden liquid-glass border-t border-white/15 px-4 py-3 space-y-2",
                  "lg:hidden sidebar-glass-mobile border-t border-white/15 px-4 py-3 space-y-2"
              )

              # Chaque option devient une carte individuelle.
              content = content.replace(
                  "liquid-glass-subtle text-sm font-medium text-muted-foreground hover:bg-white/10 hover:text-foreground transition-all",
                  "sidebar-glass-item text-sm font-medium text-muted-foreground hover:text-foreground transition-all"
              )

              content = content.replace(
                  "liquid-glass-subtle text-sm text-muted-foreground hover:bg-white/10 hover:text-foreground transition-all",
                  "sidebar-glass-item text-sm text-muted-foreground hover:text-foreground transition-all"
              )

              # Option mobile Home.
              content = content.replace(
                  "rounded-xl liquid-glass-subtle text-sm text-muted-foreground hover:bg-white/10 hover:text-foreground transition-all",
                  "rounded-xl sidebar-glass-item text-sm text-muted-foreground hover:text-foreground transition-all"
              )

              # Espacement du nav principal.
              content = content.replace(
                  '<nav className="space-y-0.5 flex-1">',
                  '<nav className="sidebar-glass-list flex-1">'
              )

              # Autres variantes fréquentes.
              content = content.replace(
                  'className="space-y-0.5 flex-1"',
                  'className="sidebar-glass-list flex-1"'
              )

              path.write_text(content, encoding="utf-8")
              print(f"Menu traité : {filename}")
          PY

      - name: Verify Liquid Glass
        shell: bash
        run: |
          test -f src/index.css

          grep -q "GESTON HOSTING — SIDEBAR LIQUID GLASS START" src/index.css
          grep -q "sidebar-glass-item" src/index.css
          grep -q "sidebar-glass-list" src/index.css
          grep -q "sidebar-glass-panel" src/index.css

          echo "Liquid Glass du menu vérifié."

      - name: Check formatting
        run: git diff --check

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Show changes
        run: git diff --stat

      - name: Commit and push only if everything passed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/index.css \
            src/pages/Home.tsx \
            src/pages/MyBots.tsx \
            src/pages/MyPanels.tsx \
            src/pages/ServicesPanel.tsx \
            src/pages/ServicesBots.tsx \
            src/pages/Tutorials.tsx \
            src/pages/Contact.tsx \
            src/pages/PurchasePanels.tsx \
            src/pages/Dashboard.tsx \
            src/pages/Admin.tsx

          git commit -m "Enhance Liquid Glass side menu"
          git push origin main
