name: Apply Liquid Glass Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liquid-glass:
    name: Improve light menu contrast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Improve light mode menus only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          css_path = Path("src/index.css")
          css = css_path.read_text(encoding="utf-8")

          marker = re.compile(
              r"/\*\s*GESTON HOSTING — LIGHT MENUS CONTRAST START\s*\*/"
              r".*?"
              r"/\*\s*GESTON HOSTING — LIGHT MENUS CONTRAST END\s*\*/",
              re.DOTALL,
          )

          css = marker.sub("", css).rstrip()

          light_menu_css = r"""
          /* =========================================================
             GESTON HOSTING — LIGHT MENUS CONTRAST START
             ========================================================= */

          /*
           * Correction visuelle uniquement pour le mode clair.
           * Le thème sombre existant n'est pas redéfini ici.
           */

          html.light .geston-menu-glass {
            background:
              rgba(255, 255, 255, 0.94) !important;

            border-right-color:
              rgba(0, 0, 0, 0.08);

            box-shadow:
              8px 0 32px rgba(0, 0, 0, 0.08),
              inset -1px 0 0 rgba(255, 255, 255, 0.90);

            backdrop-filter:
              blur(24px)
              saturate(150%);

            -webkit-backdrop-filter:
              blur(24px)
              saturate(150%);

            color:
              hsl(222 30% 12%);
          }

          html.light .geston-mobile-menu {
            background:
              rgba(255, 255, 255, 0.94) !important;

            border-top-color:
              rgba(0, 0, 0, 0.08);

            box-shadow:
              0 10px 32px rgba(0, 0, 0, 0.08),
              inset 0 1px 0 rgba(255, 255, 255, 0.90);

            backdrop-filter:
              blur(24px)
              saturate(150%);

            -webkit-backdrop-filter:
              blur(24px)
              saturate(150%);
          }

          html.light .geston-menu-option {
            background:
              transparent !important;

            border:
              0 !important;

            outline:
              none !important;

            box-shadow:
              none !important;

            color:
              hsl(222 30% 12%) !important;

            text-shadow:
              none;
          }

          html.light .geston-menu-option:hover {
            background:
              rgba(0, 0, 0, 0.055) !important;

            color:
              hsl(222 30% 8%) !important;
          }

          html.light .geston-menu-option svg {
            color:
              currentColor !important;

            opacity:
              0.95;
          }

          html.light .geston-menu-option span,
          html.light .geston-menu-option div {
            color:
              inherit;
          }

          html.light .geston-menu-glass .text-muted-foreground,
          html.light .geston-mobile-menu .text-muted-foreground {
            color:
              hsl(215 16% 38%) !important;
          }

          /* =========================================================
             GESTON HOSTING — LIGHT MENUS CONTRAST END
             ========================================================= */
          """

          # Contrôle strict : aucune règle html.dark ne doit être
          # présente dans le CSS actif de correction.
          active_css = re.sub(
              r"/\*.*?\*/",
              "",
              light_menu_css,
              flags=re.DOTALL,
          )

          if re.search(r"html\.dark\b", active_css):
              raise SystemExit(
                  "ERREUR : une règle html.dark a été introduite."
              )

          css += "\n\n" + light_menu_css.strip() + "\n"
          css_path.write_text(css, encoding="utf-8")

          print("Correction du mode clair appliquée.")
          print("Le mode sombre n'a pas été redéfini.")
          PY

      - name: Verify light menu correction
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          css = Path("src/index.css").read_text(encoding="utf-8")

          pattern = re.compile(
              r"/\*\s*GESTON HOSTING — LIGHT MENUS CONTRAST START\s*\*/"
              r"(.*?)"
              r"/\*\s*GESTON HOSTING — LIGHT MENUS CONTRAST END\s*\*/",
              re.DOTALL,
          )

          matches = pattern.findall(css)

          if len(matches) != 1:
              raise SystemExit(
                  f"ERREUR : nombre de blocs clair incorrect : {len(matches)}"
              )

          block = re.sub(
              r"/\*.*?\*/",
              "",
              matches[0],
              flags=re.DOTALL,
          )

          if re.search(r"html\.dark\b", block):
              raise SystemExit(
                  "ERREUR : le bloc de correction contient une règle sombre."
              )

          required = [
              "html.light .geston-menu-glass",
              "html.light .geston-mobile-menu",
              "html.light .geston-menu-option",
              "html.light .geston-menu-option svg",
          ]

          for rule in required:
              if rule not in matches[0]:
                  raise SystemExit(
                      f"ERREUR : règle manquante : {rule}"
                  )

          print("OK : menu Admin/Client en mode clair vérifié.")
          print("OK : textes et icônes en mode clair vérifiés.")
          print("OK : aucune règle sombre ajoutée.")
          PY

      - name: Check formatting
        run: git diff --check

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Show changes
        run: |
          echo "===== MODIFICATIONS ====="
          git diff --stat

          echo "===== FICHIERS MODIFIÉS ====="
          git diff --name-only

      - name: Commit and push only after everything passes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/index.css

          git commit -m "Improve light menu readability"

          git push origin main
