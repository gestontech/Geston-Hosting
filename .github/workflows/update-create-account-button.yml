name: Update Create Account Button

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-button:
    name: Bouton Créer un compte
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Modifier Home.tsx
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/Home.tsx")

          if not path.exists():
              raise SystemExit("ERREUR : src/pages/Home.tsx introuvable.")

          text = path.read_text(encoding="utf-8")
          original = text

          text = text.replace(
              "bg-lime-500 text-lime-950 hover:bg-lime-400 shadow-lg shadow-lime-500/20",
              "bg-emerald-500/20 dark:bg-emerald-400/15 "
              "backdrop-blur-xl "
              "border border-emerald-400/30 dark:border-emerald-300/25 "
              "shadow-lg shadow-emerald-500/10 "
              "text-black dark:text-white "
              "hover:bg-emerald-500/25 dark:hover:bg-emerald-400/20 "
              "hover:border-emerald-400/40 dark:hover:border-emerald-300/35 "
              "transition-all duration-200"
          )

          text = text.replace(
              "bg-lime-500 text-lime-950 hover:bg-lime-400",
              "bg-emerald-500/20 dark:bg-emerald-400/15 "
              "backdrop-blur-xl "
              "border border-emerald-400/30 dark:border-emerald-300/25 "
              "shadow-sm shadow-emerald-500/10 "
              "text-black dark:text-white "
              "hover:bg-emerald-500/25 dark:hover:bg-emerald-400/20 "
              "hover:border-emerald-400/40 dark:hover:border-emerald-300/35 "
              "transition-all duration-200"
          )

          text = text.replace(
              "flex-1 bg-lime-500 text-lime-950 hover:bg-lime-400",
              "flex-1 bg-emerald-500/20 dark:bg-emerald-400/15 "
              "backdrop-blur-xl "
              "border border-emerald-400/30 dark:border-emerald-300/25 "
              "shadow-sm shadow-emerald-500/10 "
              "text-black dark:text-white "
              "hover:bg-emerald-500/25 dark:hover:bg-emerald-400/20 "
              "hover:border-emerald-400/40 dark:hover:border-emerald-300/35 "
              "transition-all duration-200"
          )

          if text == original:
              raise SystemExit(
                  "ERREUR : aucune modification détectée dans Home.tsx."
              )

          path.write_text(text, encoding="utf-8")

          print("✓ Home.tsx modifié.")

      - name: Vérifier le style Liquid Glass
        shell: bash
        run: |
          echo "Vérification..."

          grep -q "bg-emerald-500/20" src/pages/Home.tsx
          grep -q "backdrop-blur-xl" src/pages/Home.tsx
          grep -q "text-black dark:text-white" src/pages/Home.tsx

          echo "✓ Style Liquid Glass détecté."
          echo "✓ Texte clair/sombre détecté."

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le build
        run: npm run build

      - name: Configurer Git
        run: |
          git config user.name "gestontech"
          git config user.email "gestonvandael15@gmail.com"

      - name: Enregistrer et pousser
        shell: bash
        run: |
          git add src/pages/Home.tsx

          if git diff --cached --quiet; then
            echo "Aucune modification à pousser."
            exit 0
          fi

          git commit -m "Style create account button with Liquid Glass"
          git push origin main
