name: Geston Hosting - Build Check

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test --if-present

      - name: TypeScript check and production build
        run: npm run build

      - name: Verify build output
        run: |
          echo "========================================"
          echo "Geston Hosting build verification"
          echo "========================================"

          if [ -d "dist" ]; then
            echo "✓ Frontend build: dist/"
            du -sh dist
          else
            echo "✗ Frontend build directory dist/ not found"
            exit 1
          fi

          if [ -d "dist-server" ]; then
            echo "✓ Server build: dist-server/"
            du -sh dist-server
          else
            echo "✗ Server build directory dist-server/ not found"
            exit 1
          fi

          echo ""
          echo "✓ Build verification completed successfully."
