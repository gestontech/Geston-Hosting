name: Geston Hosting - Build Check

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Production build
        env:
          NODE_ENV: production
          JWT_SECRET: ci-test-secret-not-for-production
          SESSION_SECRET: ci-session-secret-not-for-production
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-not-for-production
          MONGODB_URI: mongodb://localhost:27017/geston-hosting-ci
          APP_URL: https://hosting.gestontech.online
          CLIENT_URL: https://hosting.gestontech.online
          SITE_URL: https://hosting.gestontech.online
          FRONTEND_ORIGIN: https://hosting.gestontech.online
        run: npm run build

      - name: Verify frontend build
        run: |
          test -f dist/index.html

          echo "========================================"
          echo "FRONTEND BUILD"
          echo "========================================"

          du -sh dist
          find dist -maxdepth 2 -type f | head -50

      - name: Verify backend build
        run: |
          test -f dist-server/index.js

          echo "========================================"
          echo "BACKEND BUILD"
          echo "========================================"

          du -sh dist-server
          find dist-server -maxdepth 2 -type f | head -50

      - name: Verify production files
        run: |
          test -f dist/index.html
          test -f dist-server/index.js

          echo ""
          echo "========================================"
          echo "GESTON HOSTING BUILD VERIFIED"
          echo "========================================"
          echo "Frontend : dist/index.html      ✓"
          echo "Backend  : dist-server/index.js ✓"
          echo "Node     : $(node --version)"
          echo "npm      : $(npm --version)"
          echo "========================================"
