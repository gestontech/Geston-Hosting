name: Geston Hosting - Liquid Glass Side Menus

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  liquid-glass-side-menus:
    name: Apply and verify Liquid Glass menus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update light Liquid Glass menu styles
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/index.css")

          if not path.exists():
              raise SystemExit("ERROR: src/index.css not found")

          css = path.read_text(encoding="utf-8")

          start = "/* GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS START */"
          end = "/* GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS END */"

          # Remove an old version of this exact block if it already exists.
          if start in css and end in css:
              before = css.split(start, 1)[0]
              after = css.split(end, 1)[1]
              css = before.rstrip() + "\n" + after.lstrip()

          block = r"""
          /* GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS START */

          /*
           * Client + Admin
           * Même panneau Liquid Glass.
           * Mode clair uniquement.
           *
           * Le mode sombre existant n'est volontairement pas modifié.
           */

          html.light .geston-menu-glass {
            background:
              linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.72),
                rgba(255, 255, 255, 0.34)
              ) !important;

            border-right-color:
              rgba(255, 255, 255, 0.72) !important;

            box-shadow:
              8px 0 34px rgba(15, 23, 42, 0.08),
              inset -1px 0 0 rgba(255, 255, 255, 0.78);

            backdrop-filter:
              blur(34px)
              saturate(175%);

            -webkit-backdrop-filter:
              blur(34px)
              saturate(175%);

            color:
              hsl(222 30% 12%);
          }

          /*
           * Options utilisant geston-menu-option.
           * Le rendu reste identique entre Client et Admin.
           */

          html.light .geston-menu-option {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.42),
                rgba(255, 255, 255, 0.16)
              ) !important;

            border:
              1px solid rgba(255, 255, 255, 0.48) !important;

            box-shadow:
              0 4px 14px rgba(15, 23, 42, 0.035),
              inset 0 1px 0 rgba(255, 255, 255, 0.72) !important;

            color:
              hsl(222 30% 12%) !important;

            text-shadow:
              none;

            backdrop-filter:
              blur(22px)
              saturate(165%);

            -webkit-backdrop-filter:
              blur(22px)
              saturate(165%);
          }

          html.light .geston-menu-option:hover {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.62),
                rgba(255, 255, 255, 0.26)
              ) !important;

            box-shadow:
              0 6px 18px rgba(15, 23, 42, 0.055),
              inset 0 1px 0 rgba(255, 255, 255, 0.82) !important;

            color:
              hsl(222 30% 8%) !important;
          }

          html.light .geston-menu-option svg {
            color:
              currentColor !important;

            opacity:
              0.95;
          }

          /*
           * Séparateurs et informations du menu.
           */

          html.light .geston-menu-glass .border-border {
            border-color:
              rgba(255, 255, 255, 0.48) !important;
          }

          html.light .geston-menu-glass .text-muted-foreground {
            color:
              hsl(215 16% 38%) !important;
          }

          /*
           * Bloc utilisateur du menu Client.
           */

          html.light .geston-menu-glass .bg-muted\/50 {
            background:
              linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.44),
                rgba(255, 255, 255, 0.18)
              ) !important;

            border-color:
              rgba(255, 255, 255, 0.48) !important;

            box-shadow:
              inset 0 1px 0 rgba(255, 255, 255, 0.72),
              0 4px 14px rgba(15, 23, 42, 0.035);
          }

          /*
           * Menu mobile.
           */

          html.light .geston-mobile-menu {
            background:
              linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.72),
                rgba(255, 255, 255, 0.34)
              ) !important;

            border-top-color:
              rgba(255, 255, 255, 0.72) !important;

            box-shadow:
              0 -10px 34px rgba(15, 23, 42, 0.08),
              inset 0 1px 0 rgba(255, 255, 255, 0.78);

            backdrop-filter:
              blur(34px)
              saturate(175%);

            -webkit-backdrop-filter:
              blur(34px)
              saturate(175%);
          }

          /* GESTON HOSTING — LIGHT LIQUID GLASS SIDE MENUS END */
          """

          css = css.rstrip() + "\n\n" + block.strip() + "\n"

          path.write_text(css, encoding="utf-8")

          print("Light Liquid Glass side-menu styles updated successfully.")
          PY

      - name: Verify required menu classes
        shell: bash
        run: |
          grep -q "html.light .geston-menu-glass" src/index.css
          grep -q "html.light .geston-menu-option" src/index.css
          grep -q "html.light .geston-mobile-menu" src/index.css

          echo "Required Liquid Glass menu selectors found."

      - name: Verify dark mode was not modified by this action
        shell: bash
        run: |
          grep -q "html.dark .geston-menu-option" src/index.css
          grep -q "html.dark .liquid-glass" src/index.css

          echo "Existing dark-mode selectors are still present."

      - name: Build
        run: npm run build

      - name: Commit only after successful build
        shell: bash
        run: |
          if git diff --quiet -- src/index.css; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/index.css
          git commit -m "Match light Liquid Glass side menus"

          git push origin HEAD:main
