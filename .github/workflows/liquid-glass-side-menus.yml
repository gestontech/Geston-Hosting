name: Geston Hosting - Client Menu Admin Style

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-menu:
    name: Update Client lateral menu only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Modify Client menu only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/pages/MyPanels.tsx")

          if not path.exists():
              raise SystemExit("ERROR: src/pages/MyPanels.tsx not found")

          content = path.read_text(encoding="utf-8")

          old_account = '''<div className="mb-5 p-3 rounded-xl bg-muted/50 border border-border/50">
            <p className="text-xs text-muted-foreground mb-0.5">'''

          new_account = '''<div className="mb-5 p-3 rounded-xl bg-transparent border-0">
            <p className="text-xs text-muted-foreground mb-0.5">'''

          if old_account not in content:
              raise SystemExit(
                  "ERROR: Client account menu block was not found. "
                  "No modification was made."
              )

          content = content.replace(old_account, new_account, 1)

          old_panels = '''className="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium bg-muted text-foreground"'''

          new_panels = '''className="w-full flex items-center justify-between px-3 py-2.5 rounded-lg geston-client-menu-option text-sm font-medium text-muted-foreground hover:text-foreground transition-all"'''

          if old_panels not in content:
              raise SystemExit(
                  "ERROR: Client Panels menu option was not found. "
                  "No modification was made."
              )

          content = content.replace(old_panels, new_panels, 1)

          old_admin = '''className="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium text-amber-400 hover:bg-amber-500/10 transition-all"'''

          new_admin = '''className="w-full flex items-center justify-between px-3 py-2.5 rounded-lg geston-client-menu-option text-sm font-medium text-amber-400 hover:bg-amber-500/10 transition-all"'''

          if old_admin not in content:
              raise SystemExit(
                  "ERROR: Client Admin Panel menu option was not found. "
                  "No modification was made."
              )

          content = content.replace(old_admin, new_admin, 1)

          path.write_text(content, encoding="utf-8")

          print("Client menu JSX updated successfully.")
          print("Admin menu was not modified.")
          PY

      - name: Add Client-only menu styling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/pages/MyPanels.tsx")
          content = path.read_text(encoding="utf-8")

          marker = "export function MyPanels() {"

          if marker not in content:
              raise SystemExit(
                  "ERROR: MyPanels component marker not found."
              )

          style_block = r'''
          const clientMenuStyle = `
            .geston-client-menu-option {
              background: transparent !important;
              border: 0 !important;
              outline: none !important;
              box-shadow: none !important;
            }

            .geston-client-menu-option:hover {
              background: rgba(255, 255, 255, 0.075) !important;
              border: 0 !important;
              box-shadow: none !important;
            }

            html.light .geston-client-menu-option {
              background: transparent !important;
              border: 0 !important;
              outline: none !important;
              box-shadow: none !important;
              color: hsl(222 30% 12%) !important;
            }

            html.light .geston-client-menu-option:hover {
              background: rgba(0, 0, 0, 0.055) !important;
              border: 0 !important;
              box-shadow: none !important;
              color: hsl(222 30% 8%) !important;
            }
          `;
          '''

          if "const clientMenuStyle = `" not in content:
              content = content.replace(
                  marker,
                  style_block.strip() + "\n\n" + marker,
                  1
              )

          # Inject the style once inside the returned component.
          return_marker = "return ("

          if return_marker not in content:
              raise SystemExit(
                  "ERROR: MyPanels return block not found."
              )

          if "<style>{clientMenuStyle}</style>" not in content:
              content = content.replace(
                  return_marker,
                  return_marker + '\n    <style>{clientMenuStyle}</style>',
                  1
              )

          path.write_text(content, encoding="utf-8")

          print("Client-only menu CSS added.")
          print("No global menu CSS was changed.")
          PY

      - name: Verify Admin file was not changed
        shell: bash
        run: |
          git diff --exit-code -- src/pages/Admin.tsx

          echo "Admin.tsx is unchanged."

      - name: Verify only the intended Client file changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"

          if [ -n "$changed" ] && [ "$changed" != "src/pages/MyPanels.tsx" ]; then
            echo "ERROR: Unexpected files changed:"
            echo "$changed"
            exit 1
          fi

          echo "Only MyPanels.tsx is modified."

      - name: Build
        run: npm run build

      - name: Commit after successful build
        shell: bash
        run: |
          if git diff --quiet -- src/pages/MyPanels.tsx; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/pages/MyPanels.tsx
          git commit -m "Match client lateral menu with admin style"
          git push origin HEAD:main
