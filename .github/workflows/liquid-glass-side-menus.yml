name: Geston Hosting - Client Menu Admin Style

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-menu:
    name: Client lateral menu only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Modify Client menu only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/pages/MyPanels.tsx")

          if not path.exists():
              raise SystemExit("ERROR: src/pages/MyPanels.tsx not found")

          content = path.read_text(encoding="utf-8")

          # ---------------------------------------------------------
          # 1. Supprimer le cadre autour du bloc utilisateur Client
          # ---------------------------------------------------------

          old = 'className="mb-5 p-3 rounded-xl bg-muted/50 border border-border/50"'
          new = 'className="mb-5 p-3 rounded-xl bg-transparent border-0"'

          if old not in content:
              raise SystemExit(
                  "ERROR: Client user block not found. "
                  "Nothing was changed."
              )

          content = content.replace(old, new, 1)

          # ---------------------------------------------------------
          # 2. Faire de "Panels" une option normale comme Admin
          # ---------------------------------------------------------

          old = (
              'className="w-full flex items-center justify-between '
              'px-3 py-2.5 rounded-lg text-sm font-medium '
              'bg-muted text-foreground"'
          )

          new = (
              'className="w-full flex items-center justify-between '
              'px-3 py-2.5 rounded-lg geston-menu-option text-sm '
              'font-medium text-muted-foreground '
              'hover:bg-white/10 hover:text-foreground transition-all"'
          )

          if old not in content:
              raise SystemExit(
                  "ERROR: Client Panels option not found. "
                  "Nothing was changed."
              )

          content = content.replace(old, new, 1)

          # ---------------------------------------------------------
          # 3. Donner à Admin Panel le même comportement d'option
          # ---------------------------------------------------------

          old = (
              'className="w-full flex items-center justify-between '
              'px-3 py-2.5 rounded-lg text-sm font-medium '
              'text-amber-400 hover:bg-amber-500/10 transition-all"'
          )

          new = (
              'className="w-full flex items-center justify-between '
              'px-3 py-2.5 rounded-lg geston-menu-option text-sm '
              'font-medium text-amber-400 '
              'hover:bg-amber-500/10 transition-all"'
          )

          if old not in content:
              raise SystemExit(
                  "ERROR: Client Admin Panel option not found. "
                  "Nothing was changed."
              )

          content = content.replace(old, new, 1)

          path.write_text(content, encoding="utf-8")

          print("Client menu updated successfully.")
          PY

      - name: Verify Admin was not modified
        shell: bash
        run: |
          if git diff --quiet -- src/pages/Admin.tsx; then
            echo "OK: Admin.tsx was not modified."
          else
            echo "ERROR: Admin.tsx was modified."
            git diff -- src/pages/Admin.tsx
            exit 1
          fi

      - name: Verify global CSS was not modified
        shell: bash
        run: |
          if git diff --quiet -- src/index.css; then
            echo "OK: index.css was not modified."
          else
            echo "ERROR: index.css was modified."
            git diff -- src/index.css
            exit 1
          fi

      - name: Verify only Client file changed
        shell: bash
        run: |
          files="$(git diff --name-only)"

          if [ "$files" != "src/pages/MyPanels.tsx" ]; then
            echo "ERROR: Unexpected files changed:"
            echo "$files"
            exit 1
          fi

          echo "OK: Only src/pages/MyPanels.tsx was changed."

      - name: Build
        run: npm run build

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet -- src/pages/MyPanels.tsx; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/pages/MyPanels.tsx
          git commit -m "Match client lateral menu with admin style"
          git push origin HEAD:main
