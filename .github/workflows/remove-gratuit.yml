name: Remove Gratuit Labels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Nettoyer les libellés de l'interface
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Modifier uniquement les textes visibles
        shell: python
        run: |
          from pathlib import Path

          files = [
              "src/pages/Deploy.tsx",
              "src/pages/ServicesBots.tsx",
              "src/pages/BotDeployPage.tsx",
              "src/components/BotCard.tsx",
              "src/pages/PurchasePanels.tsx",
              "src/pages/MyPanels.tsx",
              "src/pages/MyBots.tsx",
              "src/pages/Home.tsx",
              "src/pages/Signup.tsx",
              "src/pages/Login.tsx",
              "src/pages/Contact.tsx",
              "src/pages/Tutorials.tsx",
              "src/pages/TopUp.tsx",
              "src/components/TopUpFlow.tsx",
              "src/components/TxTopUpModal.tsx",
              "src/components/topup/CustomTxModal.tsx",
              "src/components/topup/KenyaPaymentModal.tsx",
              "src/components/topup/NigeriaPaymentModal.tsx",
              "src/components/topup/OtherCountryPaymentModal.tsx",
          ]

          replacements = {
              "Déployer gratuitement": "Déployer",
              "déployer gratuitement": "déployer",
              "Créer gratuitement": "Créer",
              "créer gratuitement": "créer",
              "Créer un compte gratuit": "Créer un compte",
              "Renouveler gratuitement": "Renouveler",
              "renouveler gratuitement": "renouveler",
              "Essayer gratuitement": "Essayer",
              "essayer gratuitement": "essayer",
              "Commander gratuitement": "Commander",
              "commander gratuitement": "commander",
              "Inscription gratuite": "Inscription",
              "Déploiement gratuit": "Déploiement",
              "déploiement gratuit": "déploiement",
              "Service gratuit": "Service",
              "Services gratuits": "Services",
              "Panels gratuits": "Panels",
              "Essai gratuit": "Essai",
              "Renouvellement gratuit": "Renouvellement",
          }

          modified = []

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  continue

              original = path.read_text(encoding="utf-8")
              updated = original

              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  modified.append(filename)

          print("Fichiers modifiés :")
          if modified:
              for filename in modified:
                  print(f"  - {filename}")
          else:
              print("  Aucun fichier à modifier.")

      - name: Vérifier les modifications
        run: |
          git diff --check

      - name: Installer les dépendances
        run: |
          npm ci

      - name: Vérifier le build
        run: |
          npm run build

      - name: Afficher le statut Git
        run: |
          git status --short

      - name: Commit et pousser
        run: |
          git add src

          if git diff --cached --quiet; then
            echo "Aucune modification à pousser."
            exit 0
          fi

          git commit -m "Remove gratuit labels from UI"
          git push origin main
