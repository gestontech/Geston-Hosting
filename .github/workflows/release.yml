name: Geston Hosting - Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geston-hosting-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        env:
          NODE_ENV: production
          JWT_SECRET: ci-test-secret-not-for-production
          SESSION_SECRET: ci-session-secret-not-for-production
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password-not-for-production
          MONGODB_URI: mongodb://localhost:27017/geston-hosting-ci
          APP_URL: https://hosting.gestontech.online
          CLIENT_URL: https://hosting.gestontech.online
          SITE_URL: https://hosting.gestontech.online
          FRONTEND_ORIGIN: https://hosting.gestontech.online
        run: npm run build

      - name: Verify web application
        run: |
          test -f dist/index.html
          test -f dist-server/index.js

      - name: Create Android project
        run: npx cap add android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Configure Android SDK for Google Play
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")

          if not path.is_file():
              raise SystemExit("android/app/build.gradle was not generated.")

          text = path.read_text()

          # Capacitor 8 generates a Groovy Android project.
          # Force the Play-required target API without changing
          # the rest of the generated project.
          text = re.sub(
              r'(?m)^(\s*)targetSdkVersion\s+\d+\s*$',
              r'\g<1>targetSdkVersion 36',
              text
          )

          text = re.sub(
              r'(?m)^(\s*)compileSdkVersion\s+\d+\s*$',
              r'\g<1>compileSdkVersion 36',
              text
          )

          if "targetSdkVersion 36" not in text:
              raise SystemExit(
                  "Could not configure targetSdkVersion 36."
              )

          if "compileSdkVersion 36" not in text:
              raise SystemExit(
                  "Could not configure compileSdkVersion 36."
              )

          path.write_text(text)
          PY

          echo "Android SDK configuration:"
          grep -nE "compileSdkVersion|targetSdkVersion" app/build.gradle

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read application version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Configure Android version
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.app_version.outputs.version }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")

          if not path.is_file():
              raise SystemExit(
                  "android/app/build.gradle was not generated."
              )

          text = path.read_text()

          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]

          matches = list(
              re.finditer(
                  r'(?m)^(\s*)versionCode\s+\d+\s*$',
                  text
              )
          )

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one versionCode declaration, "
                  f"found {len(matches)}."
              )

          text = re.sub(
              r'(?m)^(\s*)versionCode\s+\d+\s*$',
              lambda m:
                  f"{m.group(1)}versionCode {version_code}",
              text,
              count=1
          )

          matches = list(
              re.finditer(
                  r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']\s*$',
                  text
              )
          )

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one versionName declaration, "
                  f"found {len(matches)}."
              )

          text = re.sub(
              r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']\s*$',
              lambda m:
                  f'{m.group(1)}versionName "{version_name}"',
              text,
              count=1
          )

          path.write_text(text)

          print("Android version configured:")
          print(f"  versionCode = {version_code}")
          print(f"  versionName = {version_name}")
          PY

          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/release.keystore

          test -s android/release.keystore

      - name: Verify release signing secrets
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

                - name: Verify Google Play target SDK
        working-directory: android
        shell: bash
        run: |
          grep -n "targetSdkVersion 36" app/build.gradle
          grep -n "compileSdkVersion 36" app/build.gradle

      - name: Build signed Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify release AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          echo "Release AAB:"
          ls -lh "$AAB"

          echo "Checking archive:"
          unzip -t "$AAB" >/dev/null

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: geston-hosting-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/release.keystore
