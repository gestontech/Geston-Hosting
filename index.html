    <style id="boot-loader-style">
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: #09090b;
        transition: opacity 0.3s ease;
      }

      .boot-cubes {
        display: flex;
        gap: 14px;
        align-items: center;
      }

      .boot-cube {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        animation: cube-float 2.1s ease-in-out infinite;
      }

      .boot-cube:nth-child(1) {
        background: linear-gradient(
          135deg,
          #4ade80,
          #16a34a
        );
        animation-delay: 0s;
      }

      .boot-cube:nth-child(2) {
        background: linear-gradient(
          135deg,
          #22d3ee,
          #0d9488
        );
        animation-delay: 0.25s;
      }

      .boot-cube:nth-child(3) {
        background: linear-gradient(
          135deg,
          #a3e635,
          #65a30d
        );
        animation-delay: 0.5s;
      }

      @keyframes cube-float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
          opacity: 0.85;
        }

        50% {
          transform: translateY(-14px) rotate(12deg);
          opacity: 1;
        }
      }

      #boot-loader img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        background: transparent;
        filter: drop-shadow(
          0 0 12px rgba(34, 197, 94, 0.35)
        );
        animation: boot-logo-pulse 2.1s ease-in-out infinite;
      }

      @keyframes boot-logo-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.9;
        }

        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      .boot-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        background: linear-gradient(
          90deg,
          #4ade80,
          #22d3ee
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        user-select: none;
      }

      @media (prefers-color-scheme: light) {
        #boot-loader {
          background: #f6f8fb;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-cube,
        #boot-loader img {
          animation: none !important;
        }
      }
    </style>
